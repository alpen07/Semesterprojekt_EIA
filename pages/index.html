<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/store.js" defer></script>
    <script src="../scripts/clicker.js" defer></script>
</head>
<body>
    <main class="game-shell">
        <div class="score-display" id="scoreDisplay">Krystalls: 0</div>
        <img class="asteroid" id="asteroid" src="../assets/pictures/asteroid.png" alt="asteroid">
    </main>

    <nav class="bottom-nav" aria-label="Game navigation">
        <button class="nav-button" id="openShopBtn" type="button">Shop</button>
        <button class="nav-button" id="openPrestigeBtn" type="button">Prestige</button>
    </nav>

    <section class="modal" id="shopModal" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal="shopModal"></div>
        <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="shopTitle">
            <header class="modal-header">
                <h2 id="shopTitle">Shop</h2>
                <button class="modal-close" type="button" data-close-modal="shopModal">×</button>
            </header>
            <p class="modal-text">Buy upgrades to increase how many Krystalls you earn per click.</p>
            <div class="shop-list" id="shopList"></div>
        </article>
    </section>

    <section class="modal" id="prestigeModal" aria-hidden="true">
        <div class="modal-backdrop" data-close-modal="prestigeModal"></div>
        <article class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="prestigeTitle">
            <header class="modal-header">
                <h2 id="prestigeTitle">Prestige</h2>
                <button class="modal-close" type="button" data-close-modal="prestigeModal">×</button>
            </header>
            <p class="modal-text" id="prestigeText">Reset your progress to earn a permanent bonus.</p>
            <button class="prestige-action" id="prestigeActionBtn" type="button">Prestige now</button>
        </article>
    </section>
</body>
</html>
